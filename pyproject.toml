[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lova-lang"
version = "1.0.0"
description = "LOVA — an AI-native integer-sequence programming language"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["programming-language", "ai-native", "code-generation", "type-directed-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]
# The core language (tokens / types / runtime / conservation / lineage /
# populations / observability / compiler / telemetry / surface) is
# stdlib-only by design — Axiom 8's "small core" applies to dependencies too.
dependencies = []

[project.scripts]
lova = "core.cli:main"

[project.optional-dependencies]
# tiktoken is used only by experiments/experiment_11_token_density.py to
# measure LLM-token counts against a GPT-4-class tokenizer (cl100k_base).
experiments = ["tiktoken>=0.5"]

[tool.setuptools]
# ``lib`` ships the LOVA-side libraries (prelude, evolution) next to
# ``core``, which locates them as ``../lib`` -- the same layout as a
# checkout, so an installed ``lova`` and a checkout behave alike.
packages = ["core", "corpus", "lib"]

[tool.setuptools.package-data]
lib = ["*.lova"]
corpus = ["*.jsonl", "*.json"]
