[package]
name = "lova-rt"
version = "0.2.0"
edition = "2021"
description = "A native LOVA runtime: the byte sequence, evaluated, step for step as core/runtime.py does."

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
