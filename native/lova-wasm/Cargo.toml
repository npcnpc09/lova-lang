[package]
name = "lova-wasm"
version = "0.1.0"
edition = "2021"
description = "LOVA in the browser: the native runtime as a WebAssembly module, the protocol in-page."

[lib]
crate-type = ["cdylib"]

[dependencies]
lova-rt = { path = "../lova-rt" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
